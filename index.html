<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    #resultado { font-size: 22px; font-weight: bold; padding: 20px; margin-top: 15px; border-radius: 8px; min-height: 30px; }
    .confirmado { background: #c8e6c9; color: #2e7d32; }
    .ja_confirmado { background: #fff3cd; color: #856404; }
    .nao_encontrado { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h2>CHECK-IN TENDA DO ENCONTRO 2026</h2>
  <div id="reader" style="width: 100%; max-width: 400px; margin: 0 auto;"></div>
  <div id="resultado"></div>

  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7p9aD2mELjRehfgg8CUr2dW4C64d6wuisqRgzd66bfQ0RHXj_1qdU_jCxyBF7HTQaZA/exec";

    var processando = false;
    var jsonpCounter = 0;

    function verificarCheckinJSONP(id) {
      return new Promise(function(resolve, reject) {
        var callbackName = 'jsonpCallback_' + (jsonpCounter++);
        var script = document.createElement('script');

        window[callbackName] = function(data) {
          resolve(data);
          delete window[callbackName];
          document.body.removeChild(script);
        };

        script.onerror = function() {
          reject(new Error('Falha ao carregar script JSONP'));
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
        };

        script.src = APPS_SCRIPT_URL + '?id=' + encodeURIComponent(id) + '&callback=' + callbackName;
        document.body.appendChild(script);

        setTimeout(function() {
          if (window[callbackName]) {
            reject(new Error('Tempo esgotado'));
            delete window[callbackName];
            if (script.parentNode) document.body.removeChild(script);
          }
        }, 10000);
      });
    }

    function onScanSuccess(id) {
      if (processando) return;
      processando = true;
      var div = document.getElementById('resultado');
      div.innerText = 'Verificando...';
      div.className = '';

      verificarCheckinJSONP(id).then(function(resp) {
        if (resp.resultado === 'confirmado') {
          div.innerText = '✅ Confirmado - ' + resp.nome;
          div.className = 'confirmado';
        } else if (resp.resultado === 'ja_confirmado') {
          div.innerText = '⚠️ Já confirmado às ' + resp.hora + ' - ' + resp.nome;
          div.className = 'ja_confirmado';
        } else {
          div.innerText = '❌ Não encontrado: ' + id;
          div.className = 'nao_encontrado';
        }
        setTimeout(function(){ processando = false; }, 2000);
      }).catch(function(err) {
        div.innerText = 'Erro de conexão: ' + err.message;
        processando = false;
      });
    }

    var scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    ).catch(function(err) {
      document.getElementById('resultado').innerText = 'Erro câmera: ' + err;
    });
  </script>
</body>
</html>
